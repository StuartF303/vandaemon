# JVM args for the Gradle daemon. Portable across OSes.
# NOTE: the corporate Windows box needs `-Djavax.net.ssl.trustStoreType=Windows-ROOT` so Gradle's
# TLS downloads trust the corp root CAs — but that is MACHINE-SPECIFIC and must NOT be committed:
# `Windows-ROOT` is not a valid trust-store type on Linux/macOS/CI and breaks their builds. Put it in
# that machine's ~/.gradle/gradle.properties (user-home overrides this project file). See project
# memory: jdk-windows-root-truststore.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
