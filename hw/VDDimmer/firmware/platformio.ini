[platformio]
default_envs = 4ch2a
description = VANDIMMER-4CH+2A firmware - 4 PWM channels + 2 addressable outputs

[env]
; Arduino-ESP32 3.x is required (ledcAttach 3-arg API, ESP32-S3 RMT).
; Espressif's own PlatformIO platform stalled at Arduino 2.0.x, so this uses
; the pioarduino community fork. If you bump this, keep the core at 3.x --
; src/board_pins.h has a compile-time guard that will stop the build otherwise.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino

; ESP32-S3-WROOM-1U-N16: 16 MB flash, no PSRAM, external antenna.
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    makuna/NeoPixelBus @ ^2.8.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0

[env:4ch2a]
; NOTE: the board has NO USB power path. Apply 12 V to J1/J2 before flashing --
; it will not enumerate from the USB-C connector alone.
upload_protocol = esptool

[env:4ch2a-ota]
upload_protocol = espota
; pass the device address on the command line:
;   pio run -e 4ch2a-ota -t upload --upload-port vandimmer-a1b2c3.local
